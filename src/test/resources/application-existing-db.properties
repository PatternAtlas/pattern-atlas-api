server.port=1977
spring.datasource.initialization-mode=always
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5060/patternatlas
spring.datasource.username=patternatlas
spring.datasource.password=patternatlas
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/auth/realms/patternpedia
spring.security.oauth2.resourceserver.jwt-set-uri=http://localhost:8081/auth/realms/patternpedia/protocol/openid-connect/cer
#----------------------------
# Latex Service
#----------------------------
io.github.patternatlas.api.latexrenderer.hostname=localhost
io.github.patternatlas.api.latexrenderer.port=5030
#----------------------------
# Setup Content
#----------------------------
setupcontent=true
